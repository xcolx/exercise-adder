<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise Adder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Exercise Adder <small>for Gym 2.0</small></h1>
    <form id="token-form">
      <input id="token" type="password" placeholder="session_token of gym2.app" autocomplete="off" required>
      <button>Load exercises</button>
    </form>
  </header>
  <nav id="tabs"></nav>
  <p id="status" hidden></p>
  <main id="view"></main>
  <script src="app.js"></script>
</body>
</html>
